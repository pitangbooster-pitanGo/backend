name: Backend Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Testes unitários das regras de negócio: não precisam de banco nem de Strapi.
      # (Integração e E2E exigem Postgres + Strapi + Playwright — ver docs/testing.md §6.)
      - name: Unit tests
        run: yarn test:unit

      - name: Build
        run: yarn build
